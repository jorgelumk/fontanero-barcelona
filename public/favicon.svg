<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background Circle / Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2563eb" stroke-width="12" opacity="0.6" />

  <!-- Water Drop in background -->
  <path d="M256 96 C256 96 160 230 160 310 C160 363.02 202.98 406 256 406 C309.02 406 352 363.02 352 310 C352 230 256 96 256 96 Z" fill="url(#dropGrad)" />

  <!-- Wrench Emblem -->
  <g transform="translate(256, 260) rotate(-45) translate(-256, -260)">
    <path d="M236 120 L276 120 L276 340 A30 30 0 0 1 236 340 Z" fill="url(#wrenchGrad)" />
    <!-- Wrench Head Top -->
    <path d="M216 140 C190 140 170 120 170 95 C170 70 190 50 216 50 C235 50 250 62 257 78 L235 95 L257 112 C250 128 235 140 216 140 Z" fill="url(#wrenchGrad)" />
  </g>

  <!-- 24h Badge Accent -->
  <circle cx="390" cy="120" r="48" fill="#dc2626" stroke="#ffffff" stroke-width="8" />
  <text x="390" y="128" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">24h</text>
</svg>
